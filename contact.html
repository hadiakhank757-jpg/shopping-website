<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - AURA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-black text-white">

  <div class="container py-5 my-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="p-4 p-md-5 rounded-4 border border-secondary bg-dark">
          <h2 class="text-gold mb-2 text-center">Contact Customer Support</h2>
          <p class="text-center text-muted mb-4">Have questions regarding shipping or luxury orders?</p>
          
          <form id="contactForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label text-muted">Full Name</label>
                <input type="text" class="form-control bg-black text-white border-secondary" required>
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted">Email Address</label>
                <input type="email" class="form-control bg-black text-white border-secondary" required>
              </div>
              <div class="col-12">
                <label class="form-label text-muted">Message</label>
                <textarea class="form-control bg-black text-white border-secondary" rows="4" required></textarea>
              </div>
              <div class="col-12 text-center mt-4">
                <button type="submit" class="btn hero-btn w-100 py-3">Send Message</button>
              </div>
            </div>
          </form>

          <div class="text-center mt-4">
            <a href="index.html" class="text-gold text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to Homepage</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    document.getElementById("contactForm").addEventListener("submit", function(e) {
      e.preventDefault();
      Swal.fire({
        icon: 'success',
        title: 'Message Delivered!',
        text: 'Thank you for reaching out. Our support team will get back to you shortly.',
        confirmButtonColor: '#D4AF37'
      });
      this.reset();
    });
  </script>
</body>
</html>
